name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            flags: -race
          - os: macos-latest
            flags: -race
          - os: windows-latest
            # Native service tests change machine-wide WinFsp/SCM state.
            flags: '-p 1'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'
          check-latest: true
      - name: Check source
        if: runner.os == 'Linux'
        run: |
          unformatted=$(gofmt -l cmd internal)
          if [ -n "$unformatted" ]; then printf '%s\n' "$unformatted"; exit 1; fi
          go mod tidy
          git diff --exit-code -- go.mod go.sum
          go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - name: Enable Linux FUSE tests
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y fuse3
          if [ ! -e /dev/fuse ]; then sudo mknod /dev/fuse c 10 229; fi
          sudo chmod 666 /dev/fuse
          echo "PKUDISK_FUSE_REQUIRE_KERNEL=1" >> "$GITHUB_ENV"
      - name: Enable Windows WinFsp tests
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $msi = Join-Path $env:RUNNER_TEMP 'winfsp.msi'
          Invoke-WebRequest 'https://github.com/winfsp/winfsp/releases/download/v2.1/winfsp-2.1.25156.msi' -OutFile $msi
          $process = Start-Process msiexec.exe -ArgumentList '/i', "`"$msi`"", '/qn', '/norestart', 'ADDLOCAL=ALL' -Wait -PassThru
          if ($process.ExitCode -notin @(0, 3010)) { throw "WinFsp installer exit code $($process.ExitCode)" }
          'CGO_ENABLED=0' >> $env:GITHUB_ENV
          'PKUDISK_FUSE_REQUIRE_KERNEL=1' >> $env:GITHUB_ENV
          'PKUDISK_FUSE_REQUIRE_SERVICE=1' >> $env:GITHUB_ENV
      - name: Test
        run: go test -count=1 ${{ matrix.flags }} ./...
      - name: Cross-build supported platforms
        if: runner.os == 'Linux'
        run: |
          for goos in linux darwin windows; do
            for goarch in amd64 arm64; do
              CGO_ENABLED=0 GOOS="$goos" GOARCH="$goarch" \
                go build -trimpath -o "$RUNNER_TEMP/pkudisk-$goos-$goarch" ./cmd/pkudisk-fuse
            done
          done
